# Dependency updates (BACKLOG item 8). Weekly, with minor and patch bumps grouped so
# routine upkeep is one PR per ecosystem, not one per package. Majors arrive alone.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
